<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swarmtier board</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2026; --muted: #667085; --line: #d9dde3;
  --plan: #6b7a90; --doing: #2563eb; --waiting: #d97706; --check: #7c3aed; --done: #16a34a;
  --bad: #dc2626; --chip: #eef1f5;
}
:root[data-theme="dark"] {
  --bg: #12151a; --panel: #1b2027; --ink: #e6e9ee; --muted: #8b95a5; --line: #2c333d;
  --plan: #8a9ab0; --doing: #60a5fa; --waiting: #fbbf24; --check: #a78bfa; --done: #4ade80;
  --bad: #f87171; --chip: #252c36;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; }
header .meta { color: var(--muted); font-size: 12px; }
button { background: var(--chip); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--muted); }
main { padding: 16px; display: grid; gap: 16px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.col { min-width: 0; background: var(--panel); border: 1px solid var(--line);
  border-top: 3px solid var(--c, var(--plan)); border-radius: 8px; padding: 10px; }
.col h2, .strip h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  margin: 0 0 8px; display: flex; justify-content: space-between; color: var(--muted); }
.col h2 b, .strip h2 b { color: var(--ink); }
.cards { display: grid; gap: 8px; min-width: 0; }
.card { min-width: 0; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px; overflow-wrap: anywhere; }
.card .t { font-weight: 600; }
.card .n { color: var(--muted); font-size: 12px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { background: var(--chip); border-radius: 10px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
.empty { color: var(--muted); font-size: 12px; font-style: italic; }
.strip { min-width: 0; background: var(--panel); border: 1px solid var(--line);
  border-left: 3px solid var(--bad); border-radius: 8px; padding: 10px; }
.strip.older { border-left-color: var(--muted); }
.strip .cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.bad { color: var(--bad); }
@media (max-width: 1000px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .board { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>swarmtier board <span class="meta" id="meta"></span></h1>
  <button id="theme" type="button" title="Toggle light/dark">Theme</button>
  <button id="full" type="button" title="Fullscreen (f)">Fullscreen</button>
</header>
<main>
  <div class="board" id="board"></div>
  <div id="stalled"></div>
  <div id="older"></div>
</main>
<script>
(function () {
  var COLORS = { plan: "--plan", doing: "--doing", waiting: "--waiting", check: "--check", done: "--done" };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function age(h) {
    if (h == null) return "";
    if (h < 1) return Math.max(1, Math.round(h * 60)) + " min ago";
    if (h < 48) return Math.round(h) + " h ago";
    return Math.round(h / 24) + " d ago";
  }
  function card(c) {
    var d = el("div", "card");
    d.appendChild(el("div", "t", c.title));
    if (c.note) d.appendChild(el("div", "n", c.note));
    var chips = el("div", "chips");
    [c.role, c.model, c.effort && ("effort: " + c.effort), c.cost != null && ("cost: " + c.cost),
     c.state, age(c.age_hours)].forEach(function (x) { if (x) chips.appendChild(el("span", "chip", x)); });
    d.appendChild(chips);
    return d;
  }
  function fill(box, cards) {
    if (!cards.length) box.appendChild(el("div", "empty", "nothing here"));
    cards.forEach(function (c) { box.appendChild(card(c)); });
  }
  function strip(host, group, cls) {
    host.textContent = "";
    if (!group.count) return;
    var s = el("section", "strip " + cls);
    var h = el("h2", null, group.title);
    h.appendChild(el("b", null, String(group.count)));
    s.appendChild(h);
    var box = el("div", "cards");
    fill(box, group.cards);
    s.appendChild(box);
    host.appendChild(s);
  }
  function render(s) {
    var board = document.getElementById("board");
    board.textContent = "";
    s.columns.forEach(function (col) {
      var sec = el("section", "col");
      sec.style.setProperty("--c", "var(" + (COLORS[col.id] || "--plan") + ")");
      var h = el("h2", null, col.title);
      h.appendChild(el("b", null, String(col.count)));
      sec.appendChild(h);
      var box = el("div", "cards");
      fill(box, col.cards);
      sec.appendChild(box);
      board.appendChild(sec);
    });
    strip(document.getElementById("stalled"), s.stalled, "");
    strip(document.getElementById("older"), s.older, "older");
    document.getElementById("meta").textContent =
      s.tasks + " tasks · older than " + s.older_after_hours + " h are folded · updated " +
      s.generated.replace("T", " ");
  }
  function poll() {
    fetch("/state", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { document.getElementById("meta").textContent = "cannot reach the server"; });
  }

  // theme: follows the system until the button is used
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem("swarmtier-theme"); } catch (e) {}
  function systemTheme() { return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
  root.setAttribute("data-theme", saved || systemTheme());
  document.getElementById("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("swarmtier-theme", next); } catch (e) {}
  });

  // fullscreen: button and the "f" key
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (root.requestFullscreen) root.requestFullscreen();
  }
  document.getElementById("full").addEventListener("click", toggleFull);
  document.addEventListener("keydown", function (e) {
    if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) toggleFull();
  });

  poll();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
